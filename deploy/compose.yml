name: ranrao-sites-relay
services:
  relay:
    build:
      context: ..
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SITE_URL: ${SITE_URL:?Set the existing Sites HTTPS origin}
      RELAY_SECRET: ${RELAY_SECRET:?Set the secret shared with the Site}
      MODEL_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DEMO_AI_ENABLED: ${DEMO_AI_ENABLED:-true}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-120}
      AI_REQUESTS_PER_IP_MINUTE: ${AI_REQUESTS_PER_IP_MINUTE:-8}
      AI_REQUESTS_GLOBAL_MINUTE: ${AI_REQUESTS_GLOBAL_MINUTE:-40}
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const age=Date.now()-require('node:fs').statSync(process.env.RELAY_HEALTH_FILE).mtimeMs; if(age>35000)process.exit(1); fetch('http://127.0.0.1:4321/api/stamp').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 2
volumes:
  relay-data:
